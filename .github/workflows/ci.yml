name: Redline CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_call:
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_ACCESS_SECRET:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode verify

      - name: Prepare S3 upload
        id: s3-artifact
        run: |
          version="$(mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)"
          artifact="target/redline-$version.jar"
          test -f "$artifact"
          mkdir -p target/s3-upload
          cp "$artifact" target/s3-upload/
          echo "folderName=$version" >> "$GITHUB_OUTPUT"

      - name: Upload JAR to S3
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' }}
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: downloads.ortussolutions.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: target/s3-upload/
          DEST_DIR: ortussolutions/redline/${{ steps.s3-artifact.outputs.folderName }}